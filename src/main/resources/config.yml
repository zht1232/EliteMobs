# ============================================
#  EliteMobs v28.0.0 - 配置文件
#  适用 Paper 1.21+ / Paper 26.x
#  作者: zht
# ============================================

# --- 基本设置 ---
general:
  enabled: true
  ai-tick-interval: 10
  elite-spawn-chance: 0.01
  min-spawn-y: 0
  max-elites-per-chunk: 2
  enabled-mob-types: []

  # 高等级精英生成时全服广播提示
  spawn-announce:
    enabled: false
    min-level: 10          # >= 此等级才广播
    announce-range: 100   # -1=全服广播, >0=只通知该范围内(格)的玩家

# --- 怪物档案 ---
# 怪物定义已拆分到独立文件: mobs.yml
# （ZOMBIE/SKELETON/... 的 health/damage/speed 倍率等全部在 mobs.yml 中配置）

# --- 功能系统 ---
features:
  creeper-explosion:
    enabled: true
    base-radius: 3.0
    radius-per-level: 0.3
    max-radius: 6.0
    negative-effect:
      enabled: true

  # 夜间增强AI
  # 夜间精英怪获得额外速度/伤害/生成率加成
  night-enhancement:
    enabled: true
    speed-bonus: 0.12        # 夜间额外速度
    damage-multiplier: 1.2   # 夜间伤害倍率
    spawn-multiplier: 1.5    # 夜间生成倍率

  wall-climb:
    enabled: true
    speed: 0.18
    max-height: 20

  block-break:
    enabled: true
    cooldown-ticks: 60
    restore-blocks: true
    restore-ticks: 200
    breakable-blocks: []

  item-steal:
    enabled: true
    steal-chance: 0.25
    cooldown-ticks: 80
    return-on-death: true
    max-stolen-items: 3

  damage-scaling:
    enabled: true
    damage-per-minute: 0.003
    damage-per-block: 0.00005
    max-multiplier: 2.0
    base-multiplier: 1.0

  weapon-enhancement:
    enabled: true
    enchant-chance: 0.40
    max-enchant-level: 4
    allow-netherite: false

# --- 精英属性 ---
elite-stats:
  health-multiplier-min: 1.2
  health-multiplier-max: 2.0
  damage-multiplier-min: 1.0
  damage-multiplier-max: 1.5
  speed-multiplier-min: 1.02
  speed-multiplier-max: 1.15

# --- 精英词缀系统 ---
# 精英怪随机获得词缀，改变战斗行为与外观（名字后缀 + 专属粒子）
elite-affixes:
  enabled: true
  chance: 0.8            # 精英获得词缀的概率 (0.0-1.0)
  min-affixes: 1         # 最少词缀数
  max-affixes: 2         # 最多词缀数
  # 词缀权重（越大越常见），可把不想要的词缀权重设 0 移除
  weights:
    FIRE_AURA: 10    # 火焰: 周期性点燃附近玩家
    FROST: 10        # 冰霜: 攻击附带减速
    THORNS: 8        # 荆棘: 近战反伤
    LIFESTEAL: 6     # 吸血: 攻击时回血
    BERSERK: 8       # 狂暴: 血量低于30%时攻击提升
    SPLIT: 5         # 分裂: 死亡时分裂出小精英
    BLINK: 6         # 瞬移: 周期闪现到玩家身后
    CHAIN: 8         # 雷链: 周期电击附近玩家

# --- 视觉效果 ---
visuals:
  glow:
    enabled: true
    min-level: 15          # >= 此等级发高亮光效（改小让更多怪发光）
  lightning:
    enabled: true
    min-level: 10          # >= 此等级生成时产生闪电效果
  name-tag:
    enabled: true
    format: "&c\u2620 &6{type} &7[&4Lv.{level}&7] &e{stars}"
    visible-range: 32
  particles:
    enabled: true

# --- 装备生成 ---
equipment:
  weapon-drop-chance: 0.90
  armor-drop-chance: 1.0

  # 调试
  debug-enchant: false

  # 护甲生成规则
  armor-generation:
    random-materials: true
    helmet-chance: 1.0
    chestplate-chance: 0.8
    leggings-chance: 0.7
    boots-chance: 0.6

    # 等级缩放公式
    # 决定各等级护甲材质分布概率
    # 可选 exponential(0.15) 或 linear
    #   Lv.1: 皮30% 金11% 锁13% 铁26% 钻15% 下界4%
    #   Lv.5: 皮10% 金10% 锁17% 铁34% 钻22% 下界7%
    #   Lv.10: 皮2% 金2% 锁9% 铁19% 钻38% 下界30%
    # 数值越高越倾向高级 base-multiplier(约0.25)
    level-scaling:
      enabled: true
      formula: "exponential"    # linear 或 exponential
      base-multiplier: 0.15

    # 材质池权重: 用于随机选择
    # 格式: LEATHER(皮革) 或 IRON_HELMET/DIAMOND_HELMET 等
    material-pool:
      LEATHER: 30
      GOLDEN_HELMET: 10
      CHAINMAIL_HELMET: 10
      IRON_HELMET: 20
      DIAMOND_HELMET: 10
      NETHERITE_HELMET: 2

  # 武器附魔池
  weapon-enchant:
    enabled: true
    chance: 0.8
    enchant-pool:
      SHARPNESS: 5-40
      FIRE_ASPECT: 2-20
      KNOCKBACK: 2-15
      LOOTING: 3-10
      UNBREAKING: 3-25

  # 护甲附魔池
  armor-enchant:
    enabled: true
    chance: 0.8
    min-level: 1
    max-level: 4
    enchant-pool:
      PROTECTION: 4-50
      UNBREAKING: 3-30
      THORNS: 3-20
      BLAST_PROTECTION: 4-15
      PROJECTILE_PROTECTION: 4-15
      FEATHER_FALLING: 4-10

# --- 区域保护 ---
protection:
  respect-worldguard: true
  respect-griefprevention: true
  respect-towny: true
  respect-factions: true
  disabled-worlds: []
  only-enabled-worlds: []

# --- 掉落设置 ---
loot:
  enabled: true
  drop-chance: 0.35
  xp-bonus-min: 5
  xp-bonus-max: 30
  # 精华掉落
  essence-drops:
    enabled: true
    # 各等级段掉落率 (0.0-1.0)
    level-1-3: 0.15
    level-4-6: 0.35
    level-7-9: 0.55
    level-10: 0.85
    # 每次掉落数量范围
    min-amount: 1
    max-amount: 2

  # 击杀奖励（Vault 金币 + PlayerPoints 点券，均为软依赖，未装自动跳过）
  rewards:
    # 金币（需要 Vault + 一个经济插件，如 EssentialsX/CoreProtect 等）
    money:
      enabled: true
      base: 0.0             # 固定基础金币
      per-level: 5.0        # 每级追加金币（奖励 = base + per-level × 精英等级）
      boss-multiplier: 3.0  # Boss 再乘以的倍数
    # 点券（需要 PlayerPoints 插件）
    points:
      enabled: true
      base: 0               # 固定基础点券
      per-level: 1          # 每级追加点券
      boss-multiplier: 3.0  # Boss 再乘以的倍数
    # 连杀加成（连续击杀精英怪不死亡，金币/点券奖励逐渐提升）
    combo:
      enabled: true
      max-multiplier: 3.0   # 最高加成倍数
      per-kill: 0.1         # 每连杀 1 只提升 0.1 倍
      reset-on-death: true  # 玩家死亡后连杀清零

# --- LuckPerms 权限组加成 ---
luckperms:
  enabled: false
  groups:
    - group: "vip"
      loot-multiplier: 1.2
      xp-multiplier: 1.1
    - group: "mvp"
      loot-multiplier: 1.5
      xp-multiplier: 1.3

# --- 铁砧淬炼成功率（参照原版） ---
essence-upgrade:
  base-rate: 0.35                  # 基础成功率（Lv.1 精华）
  per-level: 0.045                 # 每级精华额外提升的成功率
  max-rate: 0.95                   # 成功率上限（0.95 = 95%）
  weapon-damage-multiplier: 0.5    # 武器淬炼攻击力系数（攻击力 = 等级² × 系数）
  armor-bonus-per-level: 1.5       # 护甲淬炼每级减伤
  armor-max-bonus: 15.0            # 护甲减伤上限

# --- 符文系统（独立于淬炼，铁砧镶嵌） ---
# 符文效果比淬炼更高级（生命/移速/药水效果），槽位数量由装备淬炼等级决定：
#   Lv.1-3 = 1槽 / Lv.4-6 = 2槽 / Lv.7-9 = 3槽 / Lv.10+ = 4槽
rune:
  # 镶嵌消耗（金币/点券/经验级）
  install-cost:
    money: 1000.0
    points: 50
    xp-levels: 30
  # 精英怪极难掉落（Boss 概率 ×2）
  drops:
    enabled: true
    chance: 0.02        # 0.02 = 2%（极难）

# ============================================
#  宝石/掉落物配置
# ============================================
# 宝石掉落（武器/护甲精华 + 铁砧淬炼）由 loot.essence-drops 单独控制，
# 与 gem-drops.mode 无关：即使 mode 为 disabled，精华仍可按其自身开关掉落。
#
# 自定义宝石推荐放在 plugins/EliteMobs/gems/*.yml（每颗宝石一个文件）：
#   复制一个文件改名即可新增宝石，删除文件即可移除宝石。
#   支持字段: id / material / name / lore / enchants / glow
#            / texture(头颅纹理) / potion-type / potion-amplifier
#            / potion-duration / mob-types / chance / amount-min / amount-max
#   也可直接在上方 config.yml 里用 gem-drops.custom 内联定义（旧方式，兼容）。
gem-drops:
  mode: custom

  # --- 内联自定义掉落（旧方式，可选；推荐改用 gems/*.yml） ---
  custom: []

  # --- 掉落总开关 (两种模式共用) ---
  drops:
    enabled: true
    # custom 模式: 该开关关闭则完全不掉落 (开启后由各条目的 chance 独立判定)
    level-1-3: 0.15
    level-4-6: 0.35
    level-7-9: 0.55
    level-10: 0.85
