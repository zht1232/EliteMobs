# ============================================
#  EliteMobs v29.16.0 - 配置文件
#  适用 Paper 1.21+ / Paper 26.x
#  作者: crystalkingdom团队
# ============================================

# --- 基本设置 ---
general:
  enabled: true
  ai-tick-interval: 10
  elite-spawn-chance: 0.01
  min-spawn-y: 0
  max-elites-per-chunk: 1
  enabled-mob-types: []
  # 精英主动索敌范围（格）。插件每1秒让精英锁定范围内最近的非豁免玩家，
  # 即使其他插件取消了原版追击事件，精英仍能追击玩家。
  # 若对方插件连 setTarget 触发的追击事件也取消，需在对方插件中排除 EliteMobs 怪物。
  target-range: 16

  # 精英生成距离：等级越高的精英生成离最近玩家越远（避免高级怪刷在玩家/基地旁边）
  #   要求最小距离 = min-dist-base + 精英等级 * dist-per-level，封顶 max-dist 格
  #   生成位置不足时自动沿"玩家→精英"方向外推传送到更远处
  spawn-distance:
    min-dist-base: 8        # 基础最小距离（格）
    dist-per-level: 0.8     # 每级额外距离（格），如 Lv.10≈16 格 / Lv.20≈24 格
    max-dist: 48            # 封顶距离（格）

  # 精英生成前距离检查：离玩家太近的区块不生成精英（保护刷怪塔/铁机/基地）
  # 0 = 禁用此检查（仅依赖生成后的 relocate 逻辑）
  # 建议值：32-64（保护基地周围的机器）
  spawn-min-player-distance: 48

  # 刷怪笼刷出的怪不精英化（保护刷怪笼式刷怪塔；暗房/水流刷怪塔靠上面的
  # spawn-min-player-distance 保护——挂机点与刷怪面距离通常小于该值）
  exclude-spawner-mobs: true

  # 高等级精英生成时全服广播提示
  spawn-announce:
    enabled: false          # 普通精英生成广播（false=关闭）
    boss-alert: true        # Boss 生成/击杀全服广播（独立开关，默认开）
    min-level: 10           # >= 此等级才广播
    announce-range: 100     # -1=全服广播, >0=只通知该范围内(格)的玩家

# --- 怪物档案 ---
# 怪物定义已拆分到独立文件: mobs.yml
# （ZOMBIE/SKELETON/... 的 health/damage/speed 倍率等全部在 mobs.yml 中配置）

# --- 功能系统 ---
features:
  creeper-explosion:
    enabled: true
    base-radius: 3.0
    radius-per-level: 0.3
    max-radius: 6.0
    negative-effect:
      enabled: true

  # 夜间增强AI
  # 夜间精英怪获得额外速度/伤害/生成率加成
  night-enhancement:
    enabled: true
    speed-bonus: 0.12        # 夜间额外速度
    damage-multiplier: 1.2   # 夜间伤害倍率
    spawn-multiplier: 1.2    # 夜间生成倍率
    vanilla-mobs: true       # 原版怪物夜间是否也获得同等强化
    # 月相系统（借鉴原版 MoonPhaseDetector）：满月夜精英生成率/强度额外提升
    moon-phase:
      enabled: true
      full-moon-spawn-multiplier: 1.3   # 满月夜生成率额外倍率
      full-moon-strength: true          # 满月夜精英额外获得力量/抗性
      full-moon-strength-level: 1       # 满月额外力量等级（0=一级）

  wall-climb:
    enabled: true
    speed: 0.18
    max-height: 20

  block-break:
    enabled: true
    cooldown-ticks: 60
    restore-blocks: true
    restore-ticks: 200
    breakable-blocks: []

  item-steal:
    enabled: true
    steal-chance: 0.25
    cooldown-ticks: 80
    return-on-death: true
    max-stolen-items: 3

  # 世界AI增强（原版怪物行为增强）
  world-ai:
    enabled: true
    # 玩家受伤时附近怪物索敌
    attract-on-hurt: true
    attract-radius: 12
    # 单次最多吸引的怪物数量（范围内随机挑选，避免全部围过来）
    max-attract-per-trigger: 10
    # 吸引冷却（秒）：受伤/低血/饥饿共享，防反复拉怪
    attract-cooldown: 5
    # 玩家低血量时吸引怪物（血量低于阈值比例）
    attract-on-low-hp: true
    low-hp-threshold: 0.3
    # 玩家严重饥饿时吸引怪物（饥饿值低于阈值）
    attract-on-hunger: true
    hunger-threshold: 6
    # 挖掘方块声音吸引怪物
    attract-on-break: true
    break-attract-radius: 12
    # 僵尸发现光源并去探索
    zombie-light-explore: true
    light-search-radius: 10
    # 怪物聚集（默认关闭，避免扎堆“洪水感”）
    mob-gathering: false
    gather-radius: 10

  damage-scaling:
    enabled: true
    damage-per-minute: 0.003
    damage-per-block: 0.00005
    max-multiplier: 2.0
    base-multiplier: 1.0

  weapon-enhancement:
    enabled: true
    enchant-chance: 0.40
    max-enchant-level: 4
    allow-netherite: false

# --- 精英属性 ---
elite-stats:
  health-multiplier-min: 1.2
  health-multiplier-max: 2.0
  damage-multiplier-min: 1.0
  damage-multiplier-max: 1.5
  speed-multiplier-min: 1.02
  speed-multiplier-max: 1.15

# --- 护甲套装加成 ---
# 判定依据: 玩家 4 个护甲位物品的 elitemobs:armor_lv 值之和（套装等级）。
#   精英怪掉落护甲 = 精英等级；玩家淬炼护甲 = 宝石等级之和。四件 Lv.10 封顶 40。
# 加成内容:
#   - 减伤: 每 1 点套装等级提供 reduction-per-level% 减伤，封顶 max-reduction%
#   - 速度: 套装等级 >= speed-level 获得速度 I
#   - 再生: 套装等级 >= regen-level 获得再生 I + 不死图腾粒子
armor-set-bonus:
  enabled: true
  reduction-per-level: 2.0    # 每点套装等级减伤 %
  max-reduction: 20.0         # 减伤封顶 %
  speed-level: 6              # 速度效果阈值（原 2）
  regen-level: 10             # 再生效果阈值（原 4）

# --- Boss 第二阶段 ---
# 血量低于 hp-ratio 时 Boss 进入第二阶段：全服广播 + 力量I/速度II/抗性I + 血条变紫 + 闪电特效。
boss-phase2:
  enabled: true
  hp-ratio: 0.5              # 血量低于该比例触发（0.5 = 50%）

# --- Boss 体型放大 ---
# Boss 体型放大倍数（scale）。1.0=不放大，1.5=放大50%，2.0=两倍。
# 会同步放大模型与碰撞体积（含飞绕盾牌/附魔书的环绕半径）。
boss-scale: 1.5

# --- Boss 特殊技能（借鉴原版 EliteMobs 技能） ---
boss-skills:
  # 跳跃扑击落地震击：Boss 被玩家击中时概率跳起，落地对周围实体击飞+减速
  ground-pound:
    enabled: true
    trigger-chance: 0.10    # 被玩家击中时触发概率 (0.0-1.0)
    global-cooldown: 200    # 触发冷却（tick，200=10秒）
    launch-y: 1.5           # 起跳初速度（y 方向）
    fall-delay: 20          # 跳起后多久开始检测落地（tick）
    radius: 10              # 落地震击影响半径（格）
    knockback: 2.0          # 击飞水平速度
    knockback-y: 1.5        # 击飞垂直速度
    slowness: 60            # 命中目标减速时长（tick）
  # 引导治疗（完整版）：Boss 扫描范围内低血量的其他精英，暂停AI+光束引导为其回血
  channel-healing:
    enabled: true
    scan-interval: 40       # 扫描间隔（tick）
    search-radius: 20       # 治疗目标搜索半径（格）
    max-channel-distance: 25  # 引导最远距离（格，超出中断）
    heal-threshold: 0.8     # 目标血量低于该比例才会被治疗
    heal-per-10ticks: 0.5   # 每10tick回复 boss等级 × 该值 的血量
    local-cooldown: 20      # 引导结束后冷却（tick）
  # 封印：Boss 进入二阶段后，短时间封印附近玩家的淬炼加成（武器攻击/护甲减伤/套装减伤暂时失效）
  seal:
    enabled: true
    duration: 5             # 封印时长（秒，建议不要太长）
    trigger-chance: 0.5     # 二阶段 Boss 释放技能时对附近玩家施加封印的概率 (0.0-1.0)
    radius: 12              # 影响半径（格）

# --- 精英词缀系统 ---
# 精英怪随机获得词缀，改变战斗行为与外观（名字后缀 + 专属粒子）
elite-affixes:
  enabled: true
  chance: 0.8            # 精英获得词缀的概率 (0.0-1.0)
  min-affixes: 1         # 最少词缀数
  max-affixes: 2         # 最多词缀数
  # 词缀权重（越大越常见），可把不想要的词缀权重设 0 移除
  weights:
    FIRE_AURA: 10    # 火焰: 周期性点燃附近玩家
    FROST: 10        # 冰霜: 攻击附带减速
    THORNS: 8        # 荆棘: 近战反伤
    LIFESTEAL: 6     # 吸血: 攻击时回血
    BERSERK: 8       # 狂暴: 血量低于30%时攻击提升
    SPLIT: 5         # 分裂: 死亡时分裂出小精英
    BLINK: 6         # 瞬移: 周期闪现到玩家身后
    CHAIN: 8         # 雷链: 周期电击附近玩家
    BLOCK_BREAK: 4   # 破块: 破坏路径上的方块（受领地保护插件限制）

# --- 视觉效果 ---
visuals:
  glow:
    enabled: true
    min-level: 15          # >= 此等级发高亮光效（改小让更多怪发光）
  lightning:
    enabled: true
    min-level: 15          # >= 此等级生成时产生闪电效果
  name-tag:
    enabled: true
    format: "&c\u2620 &6{type} &7[&4Lv.{level}&7] &e{stars}"
    visible-range: 32
  particles:
    enabled: true

# --- 装备生成 ---
equipment:
  weapon-drop-chance: 0.90
  armor-drop-chance: 1.0

  # 调试
  debug-enchant: false

  # 护甲生成规则
  armor-generation:
    random-materials: true
    helmet-chance: 1.0
    chestplate-chance: 0.8
    leggings-chance: 0.7
    boots-chance: 0.6

    # 等级缩放公式
    # 决定各等级护甲材质分布概率
    # 可选 exponential(0.15) 或 linear
    #   Lv.1: 皮30% 金11% 锁13% 铁26% 钻15% 下界4%
    #   Lv.5: 皮10% 金10% 锁17% 铁34% 钻22% 下界7%
    #   Lv.10: 皮2% 金2% 锁9% 铁19% 钻38% 下界30%
    # 数值越高越倾向高级 base-multiplier(约0.25)
    level-scaling:
      enabled: true
      formula: "exponential"    # linear 或 exponential
      base-multiplier: 0.15

    # 材质池权重: 用于随机选择
    # 格式: LEATHER(皮革) 或 IRON_HELMET/DIAMOND_HELMET 等
    material-pool:
      LEATHER: 30
      GOLDEN_HELMET: 10
      CHAINMAIL_HELMET: 10
      IRON_HELMET: 20
      DIAMOND_HELMET: 10
      NETHERITE_HELMET: 2

  # 武器附魔池
  weapon-enchant:
    enabled: true
    chance: 0.8
    enchant-pool:
      SHARPNESS: 5-40
      FIRE_ASPECT: 2-20
      KNOCKBACK: 2-15
      LOOTING: 3-10
      UNBREAKING: 3-25

  # 护甲附魔池
  armor-enchant:
    enabled: true
    chance: 0.8
    min-level: 1
    max-level: 4
    enchant-pool:
      PROTECTION: 4-50
      UNBREAKING: 3-30
      THORNS: 3-20
      BLAST_PROTECTION: 4-15
      PROJECTILE_PROTECTION: 4-15
      FEATHER_FALLING: 4-10

# --- 区域保护 ---
protection:
  respect-worldguard: true
  respect-griefprevention: true
  respect-towny: true
  respect-factions: true
  disabled-worlds: []
  only-enabled-worlds: []

# --- 掉落设置 ---
loot:
  enabled: true
  drop-chance: 0.35
  xp-bonus-min: 5
  xp-bonus-max: 30
  # 精华掉落
  essence-drops:
    enabled: true
    # 各等级段掉落率 (0.0-1.0)
    level-1-3: 0.15
    level-4-6: 0.35
    level-7-9: 0.55
    level-10: 0.85
    # 每次掉落数量范围
    min-amount: 1
    max-amount: 2

  # 击杀奖励（Vault 金币 + PlayerPoints 点券，均为软依赖，未装自动跳过）
  rewards:
    # 金币（需要 Vault + 一个经济插件，如 EssentialsX/CoreProtect 等）
    money:
      enabled: true
      base: 0.0             # 固定基础金币
      per-level: 5.0        # 每级追加金币（奖励 = base + per-level × 精英等级）
      boss-multiplier: 3.0  # Boss 再乘以的倍数
    # 点券（需要 PlayerPoints 插件）
    points:
      enabled: true
      base: 0               # 固定基础点券
      per-level: 1          # 每级追加点券
      boss-multiplier: 3.0  # Boss 再乘以的倍数
    # 连杀加成（连续击杀精英怪不死亡，金币/点券奖励逐渐提升）
    combo:
      enabled: true
      max-multiplier: 3.0   # 最高加成倍数
      per-kill: 0.1         # 每连杀 1 只提升 0.1 倍
      reset-on-death: true  # 玩家死亡后连杀清零

# --- LuckPerms 权限组加成 ---
luckperms:
  enabled: false
  groups:
    - group: "vip"
      loot-multiplier: 1.2
      xp-multiplier: 1.1
    - group: "mvp"
      loot-multiplier: 1.5
      xp-multiplier: 1.3

# --- 铁砧淬炼成功率（参照原版） ---
essence-upgrade:
  base-rate: 0.35                  # 基础成功率（Lv.1 精华）
  per-level: 0.045                 # 每级精华额外提升的成功率
  max-rate: 0.95                   # 成功率上限（0.95 = 95%）
  weapon-damage-multiplier: 0.5    # 武器淬炼攻击力系数（攻击力 = 等级² × 系数）
  armor-bonus-per-level: 1.5       # 护甲淬炼每级减伤
  armor-max-bonus: 15.0            # 护甲减伤上限
  # 铁砧宝石合成：2 个同类型同级宝石（gems/*.yml）合成高一级（Lv.10 满级不可合成）
  gem-combine-enabled: true

# --- 武器/护甲品质（首次淬炼时掷定，固化后影响后续淬炼成功率） ---
# 9 档品质：残次 < 粗劣 < 普通 < 优秀 < 传说 < 史诗 < 神话 < 至臻 < 不朽
# 劣质品质（残次/粗劣）削弱淬炼成功率，优质品质加成；Lore 中各档颜色独立
quality:
  # 首次淬炼时的品质权重（9 个，合计 100）
  weights: [8, 12, 30, 20, 12, 10, 5, 2, 1]
  # 品质对淬炼成功率的加成（与 essence-upgrade.base-rate/per-level 相加，封顶 max-rate，下限 min-rate）
  #   残次-15% / 粗劣-8% / 普通 0% / 优秀+3% / 传说+6% / 史诗+9% / 神话+12% / 至臻+15% / 不朽+18%
  success-bonus: [-0.15, -0.08, 0.0, 0.03, 0.06, 0.09, 0.12, 0.15, 0.18]
  min-rate: 0.05              # 淬炼成功率下限（劣质品质也不能完全锁死）

# --- 武器熟练度（击杀驱动升星：击杀敌对生物累计熟练度，达阈值自动升星） ---
# 升星所需击杀随星级指数增长：第 N 星 = kill-base × kill-growth^(N-1)
#   默认 2000 / 4000 / 8000 / 16000 / 32000，满 5 星累计 62000 击杀
#   普通怪 +1 击杀，精英怪按 elite-kill-multiplier 倍计数（鼓励野外打精英）
weapon-proficiency:
  enabled: true
  max-stars: 5                 # 熟练度星级上限（1-5）
  kill-base: 2000              # 第 1 颗星所需击杀数
  kill-growth: 2.0             # 每星击杀需求倍率（指数增长）
  elite-kill-multiplier: 5     # 击杀精英怪按 N 倍计数
  count-elite-only: false      # true=只统计精英怪击杀（防暗房刷怪塔刷熟练度），false=普通怪也统计
  exclude-spawner-kills: true  # 刷怪笼刷出的怪不计击杀（保护刷怪笼刷怪塔）
  crit-chance-per-star: 0.02   # 每星暴击率（满 5 星 = 10%）
  max-crit-chance: 0.10        # 暴击率上限
  crit-multiplier: 1.5         # 暴击伤害倍率（×1.5）
  full-star-crit-bonus: 0.10   # 满星额外暴击伤害加成（满星暴击 = ×1.6）
  success-bonus-per-star: 0.01 # 每星淬炼成功率加成（与品质叠加，封顶 95%）

# --- 二段跳宝石（空中连按空格触发；2=双击旧行为，3=三连击，默认 3） ---
double-jump:
  presses: 3

# --- 符文系统（独立于淬炼，铁砧镶嵌） ---
# 符文效果比淬炼更高级（生命/移速/药水效果），槽位数量由装备淬炼等级决定：
#   Lv.1-3 = 1槽 / Lv.4-6 = 2槽 / Lv.7-9 = 3槽 / Lv.10+ = 4槽
rune:
  # 镶嵌消耗（金币/点券/经验级）
  install-cost:
    money: 1000.0
    points: 50
    xp-levels: 30
    level-scaling: true   # 金币/经验随符文等级增长（Lv.N = 基础 × N），点券固定
  # 精英怪极难掉落（Boss 概率 ×2）
  drops:
    enabled: true
    chance: 0.02        # 0.02 = 2%（极难）
    # 符文掉落等级公式: runeLevel = clamp(base + floor(精英等级 / divisor), 1, max-level)
    #   默认 base=1 divisor=3 max=10: 精英1-2→Lv1 / 3-5→Lv2 / 6-8→Lv3 / 9-11→Lv4 / 12-14→Lv5 / 15-17→Lv6 / 18-20→Lv7
    level-base: 1
    level-divisor: 3
    max-level: 10
  # 铁砧符文合成：2 个同类型同级符文合成高一级（Lv.10 满级不可合成）
  combine:
    enabled: true

# --- 强化菜单 / 商城（/emmenu 主界面 → 二级菜单；含宝石商城 + 符文商城） ---
# 宝石价格 = 基础价 × 等级系数（系数 = 1 + 等级×(等级-1)/10，越高级越贵，Lv.10 = 10 倍基础价）
# 两种货币任选其一支付（金币优先，金币不足/不可用时自动用点券，无需两种都付）
shop:
  enabled: true
  gem-daily-limit: 10   # 宝石每日每人限购（所有宝石合计，0=不限）
  # 宝石价格：格式 "<id>: 金币 点券"（Lv.1=基础价，Lv.N = 基础价 × (1 + N×(N-1)/10)）
  gem-prices:
    attack_gem: "5000 200"
    defense_gem: "5000 200"
    magnet_gem: "5000 200"
    double_jump_gem: "5000 200"
    unbreaking_gem: "5000 200"
    thunder_gem: "5000 200"
    knockback_gem: "5000 200"
    lifesteal_gem: "5000 200"
    fire_aspect_gem: "5000 200"
    rare_skull: "5000 200"
  # 符文价格（Lv.1 基础价 = 20万金币/1500点券；实际 = 基础 × 等级，商城最高出售 Lv.5 = 100万金币）
  rune-prices:
    HEALTH: "200000 1500"
    SPEED: "200000 1500"
    STRENGTH: "200000 1500"
    REGEN: "200000 1500"
    RESIST: "200000 1500"
    FIRE: "200000 1500"
  # 消耗品价格（淬炼保护符 / 宝石拆卸器）
  utility-prices:
    protection-charm: "1000 100"
    gem-remover: "5000 200"

# ============================================
#  宝石/掉落物配置
# ============================================
# 宝石掉落（武器/护甲精华 + 铁砧淬炼）由 loot.essence-drops 单独控制，
# 与 gem-drops.mode 无关：即使 mode 为 disabled，精华仍可按其自身开关掉落。
#
# 自定义宝石推荐放在 plugins/EliteMobs/gems/*.yml（每颗宝石一个文件）：
#   复制一个文件改名即可新增宝石，删除文件即可移除宝石。
#   支持字段: id / material / name / lore / enchants / glow
#            / texture(头颅纹理) / potion-type / potion-amplifier
#            / potion-duration / mob-types / chance / amount-min / amount-max
#   也可直接在上方 config.yml 里用 gem-drops.custom 内联定义（旧方式，兼容）。
#
# 掉落优先级: 宝石(最高) > 保护符 > 符文(最低)
#   宝石掉落时从 gems/*.yml 所有允许掉落的宝石中，按各自 chance 权重随机选一颗。
gem-drops:
  mode: custom

  # --- 内联自定义掉落（旧方式，可选；推荐改用 gems/*.yml） ---
  custom: []

  # --- 掉落总开关（关闭则宝石/保护符/符文全不掉落）---
  drops:
    enabled: true

  # --- 宝石掉落（必掉）---
  # 击杀精英必掉宝石（只要 gems/*.yml 有可用宝石），颗数随精英等级提升:
  #   颗数 = 1 + 精英等级/3（Lv1→1, Lv3→2, Lv6→3, Lv9→4, Lv12→5, Lv15→6, Lv18→7），Boss 额外 +1
  # 每颗从 gems/*.yml 按各自 chance 权重随机选（可能掉落不同种类）

  # 保护符掉落概率（0.0-1.0）。要求: 宝石(必掉) > 保护符 >>> 符文
  charm-drop-chance: 0.08
