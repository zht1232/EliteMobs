# --- 基本设置 ---
general:
  enabled: true
  ai-tick-interval: 10
  elite-spawn-chance: 0.01
  min-spawn-y: 0
  max-elites-per-chunk: 2
  enabled-mob-types: []

  # 高等级精英生成时全服广播提示
  spawn-announce:
    enabled: false
    min-level: 10          # >= 此等级才广播
    announce-range: 100   # -1=全服广播, >0=只通知该范围内(格)的玩家

